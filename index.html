<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoulKit — AI Seller Toolkit</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ══════════════════════════════
   LANDING VARIABLES (항상 다크)
══════════════════════════════ */
:root{
  --bg:#0a0a16;--bg2:#06060f;--bg3:#1a1a2e;
  --border:#2a2a4a;--border2:#1e1e3a;
  --accent:#7c3aed;--accent2:#a78bfa;
  --gold:#f5e6c8;--gold2:#f0d9a8;
  --text:#e8e4ff;--text2:#6b6b9a;--text3:#3a3a5a;
  --card:#0d0d1f;
}

/* ══════════════════════════════
   APP VARIABLES (테마 적용)
══════════════════════════════ */
body.theme-dark{--abg:#0a0a16;--abg2:#06060f;--abg3:#1a1a2e;--aborder:#2a2a4a;--aborder2:#1e1e3a;--aaccent:#7c3aed;--aaccent2:#a78bfa;--atext:#e8e4ff;--atext2:#6b6b9a;--atext3:#3a3a5a;--tab-active:#a78bfa;--logo-c:#a78bfa;--chat-bg:#1e1040;--chat-border:#7c3aed;--chat-icon:#a78bfa;--iframe-bg:#050509;--btn-text:#06060f;--acard:#0d0d1f;--update:#111128}
body.theme-light{--abg:#f8f6f0;--abg2:#ffffff;--abg3:#f0ede6;--aborder:#e0ddd4;--aborder2:#e8e5dc;--aaccent:#1a2b5e;--aaccent2:#2d4a8e;--atext:#1a2b5e;--atext2:#6b7a9a;--atext3:#b0aaa0;--tab-active:#1a2b5e;--logo-c:#1a2b5e;--chat-bg:#1a2b5e;--chat-border:#1a2b5e;--chat-icon:#ffffff;--iframe-bg:#f0ede6;--btn-text:#ffffff;--acard:#ffffff;--update:#f5f3ee}
body.theme-soul{--abg:#0a0a16;--abg2:#06060f;--abg3:#1a1a2e;--aborder:#2a2a4a;--aborder2:#1e1e3a;--aaccent:#f5e6c8;--aaccent2:#f0d9a8;--atext:#f5e6c8;--atext2:#8a7a5a;--atext3:#3a3a5a;--tab-active:#f5e6c8;--logo-c:#f5e6c8;--chat-bg:#f5e6c8;--chat-border:#f5e6c8;--chat-icon:#0a0a16;--iframe-bg:#050509;--btn-text:#0a0a16;--acard:#0d0d1f;--update:#111128}

/* ── LANDING WRAPPER ── */
#landing{
  position:fixed;inset:0;z-index:5000;
  background:var(--bg);
  overflow-y:auto;overflow-x:hidden;
  transition:opacity .7s ease;
  cursor:none;
}
#landing.hide{opacity:0;pointer-events:none}

/* NOISE */
#landing::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:1;opacity:0.22;
}

/* CURSOR */
.cur{position:fixed;width:8px;height:8px;background:var(--accent2);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
.cur-ring{position:fixed;width:28px;height:28px;border:1px solid rgba(167,139,250,0.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all .13s ease}

/* ── LANDING NAV ── */
.l-nav{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:54px;
  background:rgba(10,10,22,0.75);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border2);z-index:5100;
}
.l-nav-logo{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:4px;color:var(--text);text-decoration:none}
.l-nav-logo span{color:var(--accent2)}
.l-nav-links{display:flex;gap:28px;align-items:center}
.l-nav-links a{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);text-decoration:none;transition:color .2s;cursor:none}
.l-nav-links a:hover{color:var(--text)}
.l-nav-cta{padding:8px 18px;border:1px solid var(--accent);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);background:transparent;cursor:none;transition:all .25s}
.l-nav-cta:hover{background:var(--accent);color:var(--text)}

/* STAR CANVAS */
.star-canvas{position:absolute;inset:0;z-index:2;pointer-events:none}

/* ── PAGE 1 HERO ── */
.page1{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.bg-word{
  position:absolute;font-family:'Bebas Neue',sans-serif;
  font-size:clamp(140px,22vw,320px);letter-spacing:-6px;
  color:transparent;-webkit-text-stroke:1px rgba(167,139,250,0.04);
  user-select:none;pointer-events:none;
  top:50%;left:50%;transform:translate(-50%,-52%);
  white-space:nowrap;z-index:3;
}
.orbit-scene{position:absolute;inset:0;top:50%;left:50%;transform:translate(-50%,-54%);width:100%;height:100%;z-index:5}

/* 소울스톤 */
.stone-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;display:flex;align-items:center;justify-content:center}
.stone-aura{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.18) 0%,rgba(124,58,237,0.06) 40%,transparent 70%);animation:auraPulse 4s ease-in-out infinite}
.stone-aura2{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.12) 0%,transparent 65%);animation:auraPulse 4s ease-in-out infinite reverse}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:0.5}}
.stone-svg{width:110px;height:110px;position:relative;z-index:1;filter:drop-shadow(0 0 28px rgba(124,58,237,0.9)) drop-shadow(0 0 60px rgba(167,139,250,0.35));animation:stoneFloat 6s ease-in-out infinite}
@keyframes stoneFloat{0%,100%{transform:translateY(0) rotate(0deg)}33%{transform:translateY(-8px) rotate(3deg)}66%{transform:translateY(4px) rotate(-2deg)}}

/* 공전 카드 */
.ocard{position:absolute;width:190px;top:50%;left:50%;border-radius:10px;border:1px solid rgba(124,58,237,0.18);background:rgba(13,13,31,0.9);backdrop-filter:blur(6px);padding:16px;opacity:0;pointer-events:none;animation:orbitArc 12s var(--delay,0s) linear infinite;will-change:transform,opacity,filter}
@keyframes orbitArc{
  0%{opacity:0.3;transform:translate(38vw,16vh) scale(0.55) rotate(2deg);filter:blur(4px) brightness(0.45);z-index:4}
  15%{opacity:0.6;transform:translate(22vw,4vh) scale(0.72) rotate(1.5deg);filter:blur(2px) brightness(0.65);z-index:5}
  35%{opacity:1;transform:translate(4vw,-14vh) scale(1.05) rotate(0deg);filter:blur(0px) brightness(1.05);z-index:20}
  50%{opacity:1;transform:translate(-8vw,-16vh) scale(1.0) rotate(-0.5deg);filter:blur(0px) brightness(1);z-index:20}
  65%{opacity:0.7;transform:translate(-22vw,-6vh) scale(0.75) rotate(-1.5deg);filter:blur(1.5px) brightness(0.7);z-index:5}
  80%{opacity:0.4;transform:translate(-34vw,8vh) scale(0.58) rotate(-2deg);filter:blur(3px) brightness(0.5);z-index:4}
  90%{opacity:0.25;transform:translate(-14vw,20vh) scale(0.5) rotate(-1deg);filter:blur(4px) brightness(0.35);z-index:3}
  100%{opacity:0.3;transform:translate(38vw,16vh) scale(0.55) rotate(2deg);filter:blur(4px) brightness(0.45);z-index:4}
}
.ocard:nth-child(1){--delay:0s}.ocard:nth-child(2){--delay:-3s}.ocard:nth-child(3){--delay:-6s}.ocard:nth-child(4){--delay:-9s}
.ocard-tag{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);margin-bottom:8px}
.ocard-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--text);line-height:1.05;margin-bottom:6px}
.ocard-desc{font-size:10px;color:var(--text2);line-height:1.6}
.ocard-line{margin-top:12px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
.ocard:nth-child(2) .ocard-line{background:linear-gradient(90deg,var(--gold),transparent)}
.ocard:nth-child(3) .ocard-line{background:linear-gradient(90deg,var(--accent2),transparent)}
.ocard:nth-child(4) .ocard-line{background:linear-gradient(90deg,var(--gold2),transparent)}

/* 왼쪽 하단 타이포 */
.hero-typo{position:absolute;bottom:56px;left:40px;z-index:15;pointer-events:none}
.hero-eyebrow{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.hero-eyebrow::before{content:'';display:block;width:20px;height:1px;background:var(--gold)}
.hero-typo h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,7vw,88px);line-height:0.88;letter-spacing:-1px}
.ht-l1{color:var(--text)}.ht-l2{color:var(--gold)}.ht-l3{color:transparent;-webkit-text-stroke:1px rgba(232,228,255,0.2)}

/* 마키 바 */
.marquee-wrap{position:absolute;bottom:0;left:0;right:0;border-top:1px solid var(--border2);padding:13px 0;overflow:hidden;background:rgba(6,6,15,0.7);backdrop-filter:blur(8px);z-index:15}
.marquee-track{display:flex;animation:marquee 22s linear infinite;white-space:nowrap}
.marquee-item{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text2);padding:0 36px;flex-shrink:0;display:flex;align-items:center;gap:14px}
.mx{color:var(--gold);font-size:9px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── PAGE 2 CTA ── */
.page2{position:relative;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.cta-wrap{position:relative;z-index:10;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cta-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:24px;display:flex;align-items:center;gap:12px}
.cta-label::before,.cta-label::after{content:'';display:block;width:18px;height:1px;background:var(--gold)}
.cta-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,8vw,108px);line-height:0.88;letter-spacing:-1px;margin-bottom:40px}
.ct1{color:var(--text)}.ct2{color:transparent;-webkit-text-stroke:1px rgba(232,228,255,0.18)}.ct3{color:var(--gold)}
.cta-btn{padding:15px 44px;background:var(--accent);color:var(--text);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;border:none;cursor:none;transition:all .3s;display:inline-flex;align-items:center;gap:10px}
.cta-btn:hover{background:var(--accent2);transform:translateY(-3px);box-shadow:0 12px 32px rgba(124,58,237,0.4)}

/* 랜딩 푸터 */
.l-footer{position:relative;z-index:10;width:100%;padding:24px 40px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border2);background:rgba(6,6,15,0.5);flex-shrink:0}
.l-footer-logo{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:4px;color:var(--text2)}
.l-footer-logo span{color:var(--accent2)}
.l-footer-links{display:flex;gap:20px}
.l-footer-links a{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);text-decoration:none;transition:color .2s;cursor:none}
.l-footer-links a:hover{color:var(--text2)}
.l-footer-copy{font-family:'Space Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:1px}

/* ── LOGIN MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(6,6,15,0.88);backdrop-filter:blur(12px);z-index:6000;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:44px 38px;width:300px;text-align:center;position:relative;animation:mIn .3s ease both}
@keyframes mIn{from{opacity:0;transform:scale(0.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;color:var(--text3);font-size:15px;cursor:none;transition:color .2s}
.modal-close:hover{color:var(--text)}
.modal-stone{margin-bottom:12px;display:flex;justify-content:center}
.modal-stone svg{width:38px;height:38px;filter:drop-shadow(0 0 10px rgba(124,58,237,0.7))}
.modal-logo{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;letter-spacing:4px;color:var(--text);margin-bottom:3px}
.modal-logo span{color:var(--accent2)}
.modal-sub{font-size:10px;color:var(--text2);letter-spacing:2px;margin-bottom:24px}
.modal-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 14px;font-size:14px;outline:none;text-align:center;letter-spacing:6px;font-family:'Space Mono',monospace;margin-bottom:10px;transition:border .2s;cursor:none}
.modal-input:focus{border-color:var(--accent2)}
.modal-btn{width:100%;background:var(--accent);color:var(--text);font-weight:700;border:none;border-radius:8px;padding:11px;font-size:12px;font-family:'Space Mono',monospace;letter-spacing:2px;cursor:none;transition:all .2s}
.modal-btn:hover{background:var(--accent2)}
.modal-err{color:#f87171;font-size:11px;margin-top:8px;display:none;font-family:'Space Mono',monospace}

/* ══════════════════════════════
   APP (원본 index 스타일)
══════════════════════════════ */
#app{display:none;height:100vh;overflow:hidden;flex-direction:column}
#app.show{display:flex}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;background:var(--abg2);border-bottom:1px solid var(--aborder2);flex-shrink:0}
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-sym{font-size:16px;color:var(--aaccent2)}
.logo{font-family:'Space Mono',monospace;font-size:12px;color:var(--logo-c);font-weight:700;letter-spacing:3px}
.icon-btn{width:30px;height:30px;border-radius:50%;background:var(--abg3);border:1px solid var(--aborder);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s}
.icon-btn:hover{border-color:var(--aaccent2)}
.icon-btn svg{width:15px;height:15px;fill:none;stroke:var(--atext2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;background:var(--abg2);border-bottom:1px solid var(--aborder2);flex-shrink:0}
.tab{flex:1;padding:10px 4px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;position:relative}
.tab.active{border-bottom-color:var(--tab-active)}
.tab svg{width:15px;height:15px;fill:none;stroke:var(--atext3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 3px;transition:stroke .2s}
.tab.active svg{stroke:var(--tab-active)}
.tab-label{font-size:9px;color:var(--atext3);transition:color .2s}
.tab.active .tab-label{color:var(--tab-active);font-weight:500}
.tab-badge{position:absolute;top:4px;right:2px;background:var(--abg3);color:var(--atext3);font-size:7px;padding:1px 3px;border-radius:2px;border:0.5px solid var(--aborder)}
.content-area{flex:1;overflow:hidden;position:relative}
.iframe-wrap{position:absolute;inset:0;background:var(--iframe-bg)}
.iframe-wrap iframe{width:100%;height:100%;border:none}
.coming-soon{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.coming-soon svg{width:36px;height:36px;fill:none;stroke:var(--atext3);stroke-width:1;opacity:.4}
.cs-text{font-size:13px;color:var(--atext3);opacity:.5;letter-spacing:1px}
.cs-sub{font-size:11px;color:var(--atext3);opacity:.3}
.home-screen{position:absolute;inset:0;overflow-y:auto;padding:20px 16px;display:none;background:var(--abg)}
.home-screen.show{display:block}
.home-greeting{margin-bottom:20px}
.home-date{font-size:10px;color:var(--atext2);letter-spacing:1px;margin-bottom:4px;font-family:'Space Mono',monospace}
.home-title{font-size:18px;font-weight:700;color:var(--atext)}
.home-title span{color:var(--aaccent2)}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.tool-card{background:var(--acard);border:1px solid var(--aborder);border-radius:12px;padding:16px 14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.tool-card:hover{border-color:var(--aaccent2);transform:translateY(-1px)}
.tool-card.disabled{opacity:.5;cursor:default}
.tool-card.disabled:hover{transform:none;border-color:var(--aborder)}
.tc-icon{width:32px;height:32px;border-radius:8px;background:var(--abg3);border:1px solid var(--aborder);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.tc-icon svg{width:16px;height:16px;fill:none;stroke:var(--aaccent2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool-card.disabled .tc-icon svg{stroke:var(--atext3)}
.tc-name{font-size:12px;font-weight:700;color:var(--atext);margin-bottom:3px}
.tool-card.disabled .tc-name{color:var(--atext2)}
.tc-desc{font-size:10px;color:var(--atext2);line-height:1.5}
.tc-soon{position:absolute;top:10px;right:10px;background:var(--abg3);color:var(--atext3);font-size:8px;padding:2px 6px;border-radius:3px;border:0.5px solid var(--aborder)}
.section-title{font-size:10px;color:var(--atext2);letter-spacing:2px;text-transform:uppercase;font-weight:500;margin-bottom:10px}
.update-list{display:flex;flex-direction:column;gap:6px}
.update-item{background:var(--update);border:0.5px solid var(--aborder);border-radius:8px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px}
.update-dot{width:6px;height:6px;border-radius:50%;background:var(--aaccent2);flex-shrink:0;margin-top:4px}
.update-date{font-size:9px;color:var(--atext3);font-family:'Space Mono',monospace;margin-bottom:2px}
.update-text{font-size:11px;color:var(--atext);line-height:1.5}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;display:none}
.overlay.show{display:block}
.settings-panel{position:fixed;top:0;right:-320px;width:280px;height:100vh;background:var(--abg2);border-left:1px solid var(--aborder);z-index:1000;transition:right .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.settings-panel.open{right:0}
.set-head{padding:18px 20px;border-bottom:1px solid var(--aborder2);display:flex;align-items:center;justify-content:space-between}
.set-title{font-size:12px;font-weight:700;color:var(--atext);letter-spacing:2px;font-family:'Space Mono',monospace}
.close-btn{background:none;border:none;color:var(--atext2);cursor:pointer;font-size:16px}
.close-btn:hover{color:var(--atext)}
.set-body{padding:20px;flex:1}
.set-label{font-size:10px;color:var(--atext2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.theme-card{border:1.5px solid var(--aborder);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:border-color .2s}
.theme-card:hover,.theme-card.selected{border-color:var(--aaccent2)}
.theme-preview{width:100%;height:36px;border-radius:5px;margin-bottom:6px;overflow:hidden;display:flex;flex-direction:column}
.tp-bar{height:10px;display:flex;align-items:center;padding:0 3px;gap:2px}
.tp-dot{width:3px;height:3px;border-radius:50%}
.tp-body{flex:1;display:flex;align-items:center;justify-content:center;font-size:8px;font-family:'Space Mono',monospace}
.theme-name{font-size:10px;color:var(--atext2)}
.theme-card.selected .theme-name{color:var(--aaccent2)}
.logout-btn{width:100%;background:transparent;border:1px solid var(--aborder);border-radius:8px;color:var(--atext2);padding:9px;font-size:12px;cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:#f87171;color:#f87171}
#fb-fab{position:fixed;bottom:22px;right:22px;width:42px;height:42px;border-radius:50%;background:var(--chat-bg);border:1.5px solid var(--chat-border);cursor:pointer;z-index:1001;display:flex;align-items:center;justify-content:center;transition:transform .2s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
